<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Executive Bifold — 3D Experience | TAJ LEATHERS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #f7f3ec;
      color: #1c1917;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .brand-font { font-family: 'Cinzel', serif; }
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }
    #webgl-canvas:active { cursor: grabbing; }
    .scroll-track {
      position: relative;
      z-index: 10;
      pointer-events: none;
    }
    .stage-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 0 6vw;
    }
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #ea580c, #f97316);
      z-index: 50;
      width: 0%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="scroll-progress" class="progress-bar"></div>

  <!-- Top Bar -->
  <header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-6 md:px-12 py-4 border-b border-orange-900/10 bg-[#f7f3ec]/80 backdrop-blur-md">
    <a href="product.html?section=leathers&id=wallet-bifold" class="flex items-center gap-3">
      <div class="w-2.5 h-7 bg-[#f97316]"></div>
      <div>
        <h1 class="brand-font text-xl md:text-2xl tracking-[0.25em] text-[#f97316] font-bold">TAJ LEATHERS</h1>
        <p class="text-[10px] tracking-[0.25em] uppercase text-stone-500">Volumetric 3D Craft • Drag Mouse to Tilt + Scroll to Unfold</p>
      </div>
    </a>

    <div class="flex items-center gap-3">
      <span class="hidden md:inline text-[11px] uppercase tracking-widest text-stone-500 mr-1">Hide Patina:</span>
      <button data-color="#581c0c" data-edge="#260b04" class="swatch w-7 h-7 rounded-full bg-[#581c0c] ring-2 ring-[#f97316] scale-110 transition"></button>
      <button data-color="#783f16" data-edge="#361a05" class="swatch w-7 h-7 rounded-full bg-[#783f16] ring-1 ring-stone-400 hover:scale-110 transition"></button>
      <button data-color="#171717" data-edge="#050505" class="swatch w-7 h-7 rounded-full bg-[#171717] ring-1 ring-stone-400 hover:scale-110 transition"></button>
    </div>
  </header>

  <!-- 3D Viewport -->
  <div id="webgl-canvas"></div>

  <!-- Scroll Stages (400vh, clean — no overlay cards) -->
  <main class="scroll-track">
    <section class="stage-section"></section>
    <section class="stage-section"></section>
    <section class="stage-section"></section>
    <section class="stage-section"></section>
  </main>

  <!-- Minimal scroll hint (fades after scrolling) -->
  <div id="scroll-hint" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-30 text-[#1c1917]/60 text-xs uppercase tracking-[0.25em] transition-opacity duration-700 flex items-center gap-2">
    <span>Scroll</span><span class="animate-bounce inline-block">↓</span>
  </div>

  <!-- Floating order button -->
  <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-30">
    <button id="order-btn" class="bg-[#f97316] hover:bg-[#ea580c] text-white font-bold text-xs uppercase tracking-[0.2em] px-8 py-3.5 rounded-full shadow-[0_8px_30px_rgba(249,115,22,0.4)] transition">
      Add to Cart — Rs 2,499
    </button>
  </div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    document.getElementById("order-btn").addEventListener("click", () => {
      const p = PRODUCTS.find(p => p.id === "wallet-bifold");
      addToCart("wallet-bifold", 1, p.colors[0], p.sizes[0]);
      window.location.href = "cart.html";
    });
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xf7f3ec, 0.03);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.45;
    container.appendChild(renderer.domElement);

    // --- High-Contrast Deep Pebble Leather Bump Map ---
    function createDeepLeatherBump() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#707070';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 85000; i++) {
        const x = Math.random() * 1024;
        const y = Math.random() * 1024;
        const r = Math.random() * 2.8 + 0.8;
        ctx.fillStyle = Math.random() > 0.45 ? 'rgba(225,225,225,0.32)' : 'rgba(30,30,30,0.35)';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      return tex;
    }

    function createNoteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#143326';
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = '#a3b18a';
      ctx.lineWidth = 10;
      ctx.strokeRect(14, 14, 484, 228);
      ctx.fillStyle = '#dad7cd';
      ctx.font = 'bold 26px Cinzel, serif';
      ctx.fillText('STATE BANK • PKR 5000', 85, 135);
      return new THREE.CanvasTexture(canvas);
    }

    const bumpTex = createDeepLeatherBump();

    // --- Volumetric PBR Materials ---
    const outerHideMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#581c0c'),
      roughness: 0.38,
      metalness: 0.05,
      bumpMap: bumpTex,
      bumpScale: 0.032,
      clearcoat: 0.45,
      clearcoatRoughness: 0.25
    });

    const pocketHideMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#6e2512'),
      roughness: 0.42,
      bumpMap: bumpTex,
      bumpScale: 0.024,
      clearcoat: 0.25
    });

    const burnishedEdgeMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color('#260b04'),
      roughness: 0.22,
      clearcoat: 0.7
    });

    const innerSuedeMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#2b1109'),
      roughness: 0.85,
      bumpMap: bumpTex,
      bumpScale: 0.04
    });

    const brassMat = new THREE.MeshStandardMaterial({
      color: 0xeab308,
      metalness: 0.94,
      roughness: 0.16
    });

    const stitchMat = new THREE.MeshStandardMaterial({
      color: 0xfde68a,
      roughness: 0.4
    });

    // --- Geometry Builders with Real 3D Extrusion & Bevels ---
    function createRoundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    // Creates a V-Notch Pocket Shape so cards are visibly recessed inside
    function createVPocketShape(w, h, r, notchDepth) {
      const s = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      s.moveTo(x + r, y);
      s.lineTo(x + w - r, y);
      s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r);
      s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      // Center V-cut thumb notch
      s.lineTo(0.45, y + h);
      s.lineTo(0, y + h - notchDepth);
      s.lineTo(-0.45, y + h);
      s.lineTo(x + r, y + h);
      s.quadraticCurveTo(x, y + h, x, y + h - r);
      s.lineTo(x, y + r);
      s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }

    function buildVolumetricSlab(w, h, depth, bevelSize, mat) {
      const shape = createRoundedRectShape(w, h, 0.14);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: depth,
        bevelEnabled: true,
        bevelSegments: 5,
        steps: 1,
        bevelSize: bevelSize,
        bevelThickness: bevelSize * 1.3
      });
      geo.center();
      const mesh = new THREE.Mesh(geo, [mat, burnishedEdgeMat]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function buildVPocketSlab(w, h, depth, notchDepth, mat) {
      const shape = createVPocketShape(w, h, 0.1, notchDepth);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: depth,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.025,
        bevelThickness: 0.025
      });
      geo.center();
      const mesh = new THREE.Mesh(geo, [mat, burnishedEdgeMat]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Adds 3D Raised Thread Stitches around a rectangular perimeter
    function createStitchLoop(w, h, zOffset) {
      const group = new THREE.Group();
      const pillGeo = new THREE.CapsuleGeometry(0.012, 0.045, 4, 8);
      pillGeo.rotateZ(Math.PI / 2);

      for (let x = -w / 2 + 0.14; x <= w / 2 - 0.14; x += 0.11) {
        const topS = new THREE.Mesh(pillGeo, stitchMat);
        topS.position.set(x, h / 2 - 0.07, zOffset);
        const botS = topS.clone();
        botS.position.y = -h / 2 + 0.07;
        group.add(topS, botS);
      }

      const pillVert = new THREE.CapsuleGeometry(0.012, 0.045, 4, 8);
      for (let y = -h / 2 + 0.14; y <= h / 2 - 0.14; y += 0.11) {
        const leftS = new THREE.Mesh(pillVert, stitchMat);
        leftS.position.set(-w / 2 + 0.07, y, zOffset);
        const rightS = leftS.clone();
        rightS.position.x = w / 2 - 0.07;
        group.add(leftS, rightS);
      }
      return group;
    }

    // --- Assemble Master 3D Wallet Rig ---
    const walletMaster = new THREE.Group();
    walletMaster.scale.setScalar(0.55); // compact size
    scene.add(walletMaster);

    const W = 2.35; // Single wing width
    const H = 1.95; // Height
    const SLAB_T = 0.14; // Real volumetric slab thickness

    // 1. RIGHT WING (Base Stationary Wing: X from 0 to +W)
    const rightWing = new THREE.Group();
    walletMaster.add(rightWing);

    const rightBackWall = buildVolumetricSlab(W, H, SLAB_T, 0.045, outerHideMat);
    rightBackWall.position.set(W / 2, 0, -0.12);
    rightWing.add(rightBackWall);
    rightWing.add(createStitchLoop(W, H, -0.02).translateX(W / 2));

    // Hidden Stash Side-Pocket Layer (Underneath card slots)
    const rightStashWall = buildVolumetricSlab(W * 0.94, H * 0.92, 0.06, 0.025, innerSuedeMat);
    rightStashWall.position.set(W / 2 + 0.03, 0, -0.01);
    rightWing.add(rightStashWall);

    // 2. LEFT WING HINGE (Pivots at X = 0, Z = +0.26)
    const leftHinge = new THREE.Group();
    leftHinge.position.set(0, 0, 0.26);
    leftHinge.rotation.y = Math.PI; // Starts folded closed!
    walletMaster.add(leftHinge);

    const leftBackWall = buildVolumetricSlab(W, H, SLAB_T, 0.045, outerHideMat);
    leftBackWall.position.set(-W / 2, 0, -0.12);
    leftHinge.add(leftBackWall);

    // Front Cover Raised Stitching + 3D Sculpted Brass Emblem (Visible on outside of Left Wing)
    const frontCoverStitches = createStitchLoop(W, H, -0.225);
    frontCoverStitches.position.x = -W / 2;
    leftHinge.add(frontCoverStitches);

    // 3D Multi-Part Brass Badge on Front Cover
    const badgeGroup = new THREE.Group();
    const badgeBase = buildVolumetricSlab(0.85, 0.34, 0.04, 0.02, burnishedEdgeMat);
    const badgeGold = buildVolumetricSlab(0.74, 0.24, 0.05, 0.018, brassMat);
    badgeGold.position.z = -0.02;
    const badgeCore = new THREE.Mesh(new THREE.OctahedronGeometry(0.07, 0), brassMat);
    badgeCore.scale.set(1.5, 0.8, 0.4);
    badgeCore.position.z = -0.055;
    badgeGroup.add(badgeBase, badgeGold, badgeCore);
    badgeGroup.position.set(-W / 2, -0.45, -0.22);
    leftHinge.add(badgeGroup);

    const leftStashWall = buildVolumetricSlab(W * 0.94, H * 0.92, 0.06, 0.025, innerSuedeMat);
    leftStashWall.position.set(-W / 2 - 0.03, 0, -0.01);
    leftHinge.add(leftStashWall);

    // 3. REAL 3D U-SHAPED ACCORDION SPINE
    const spineGroup = new THREE.Group();
    const spineCylinder = new THREE.Mesh(
      new THREE.CylinderGeometry(0.24, 0.24, H + 0.08, 32, 1, false, Math.PI, Math.PI),
      outerHideMat
    );
    spineCylinder.position.set(0.02, 0, 0.07);
    spineCylinder.castShadow = true;
    spineGroup.add(spineCylinder);

    // Top & Bottom Burnished Spine Caps
    [-H / 2 - 0.04, H / 2 + 0.04].forEach(yPos => {
      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.245, 0.245, 0.03, 32, 1, false, Math.PI, Math.PI),
        burnishedEdgeMat
      );
      cap.position.set(0.02, yPos, 0.07);
      spineGroup.add(cap);
    });
    walletMaster.add(spineGroup);

    // 4. STEPPED 3D V-CUT CARD POCKETS + THICK EMBOSSED CARDS
    const rightCards = [], rightPockets = [];
    const leftCards = [], leftPockets = [];
    const cardColors = [0x0f172a, 0xd4af37, 0x3f1d1d];

    for (let i = 0; i < 3; i++) {
      const pocketH = 0.78 + i * 0.26;
      const yPos = -H / 2 + pocketH / 2 + 0.08;
      const zLayer = 0.05 + (2 - i) * 0.055; // Real stepped 3D depth per pocket

      // Right V-Pocket
      const rPocket = buildVPocketSlab(W * 0.9, pocketH, 0.035, 0.14, pocketHideMat);
      rPocket.position.set(W / 2, yPos, zLayer);
      rightWing.add(rPocket);
      rightPockets.push({ mesh: rPocket, baseZ: zLayer, index: i });

      // Right Thick 3D Card with Gold EMV Chip
      const rCardGroup = new THREE.Group();
      const rCardBody = buildVolumetricSlab(W * 0.78, 1.05, 0.03, 0.015, new THREE.MeshStandardMaterial({
        color: cardColors[i],
        metalness: i === 1 ? 0.88 : 0.35,
        roughness: 0.22
      }));
      const chip = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.18, 0.045), brassMat);
      chip.position.set(-0.45, 0.15, 0.01);
      rCardGroup.add(rCardBody, chip);

      const cardBaseY = -0.18 + i * 0.24;
      const cardBaseZ = zLayer - 0.022;
      rCardGroup.position.set(W / 2, cardBaseY, cardBaseZ);
      rCardGroup.userData = { baseY: cardBaseY, baseZ: cardBaseZ, index: i };
      rightWing.add(rCardGroup);
      rightCards.push(rCardGroup);

      // Left V-Pocket
      const lPocket = buildVPocketSlab(W * 0.9, pocketH, 0.035, 0.14, pocketHideMat);
      lPocket.position.set(-W / 2, yPos, zLayer);
      leftHinge.add(lPocket);
      leftPockets.push({ mesh: lPocket, baseZ: zLayer, index: i });

      // Left Thick 3D Card
      const lCardGroup = rCardGroup.clone();
      lCardGroup.position.set(-W / 2, cardBaseY, cardBaseZ);
      lCardGroup.userData = { baseY: cardBaseY, baseZ: cardBaseZ, index: i };
      leftHinge.add(lCardGroup);
      leftCards.push(lCardGroup);
    }

    // 5. REAR DUAL BILLFOLD CASH COMPARTMENT & 3D CURVED BANKNOTES
    const cashDividerWall = buildVolumetricSlab(W * 1.9, H * 0.9, 0.045, 0.02, innerSuedeMat);
    cashDividerWall.position.set(0, -0.02, -0.22);
    walletMaster.add(cashDividerWall);

    const cashNotesGroup = new THREE.Group();
    const noteMat = new THREE.MeshStandardMaterial({
      map: createNoteTexture(),
      roughness: 0.55
    });
    for (let b = 0; b < 3; b++) {
      const note = buildVolumetricSlab(3.7, 1.48, 0.015, 0.008, noteMat);
      note.position.set((b - 1) * 0.08, b * 0.07, -b * 0.045);
      note.rotation.z = (b - 1) * -0.025;
      cashNotesGroup.add(note);
    }
    cashNotesGroup.position.set(0, 0, -0.18);
    cashNotesGroup.scale.set(0.01, 1, 1);
    walletMaster.add(cashNotesGroup);

    // --- Studio Lighting (tuned for cream backdrop) ---
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    const keySpot = new THREE.SpotLight(0xfff0dd, 95);
    keySpot.position.set(5.5, 6.5, 6.5);
    keySpot.angle = Math.PI / 3.2;
    keySpot.penumbra = 0.65;
    keySpot.castShadow = true;
    keySpot.shadow.mapSize.set(2048, 2048);
    scene.add(keySpot);

    // Golden rim light from left-back to highlight 3D edges
    const rimLight = new THREE.DirectionalLight(0xf97316, 2.2);
    rimLight.position.set(-6, 4, -5);
    scene.add(rimLight);

    const bottomFill = new THREE.PointLight(0xea580c, 8, 14);
    bottomFill.position.set(0, -3, 4);
    scene.add(bottomFill);

    // --- Math Helpers ---
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
    const remap = (val, inMin, inMax) => clamp((val - inMin) / (inMax - inMin), 0, 1);
    const smoothstep = (t) => t * t * (3 - 2 * t);
    const lerp = (a, b, t) => a + (b - a) * t;

    let targetScroll = 0;
    let currentScroll = 0;

    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      targetScroll = maxScroll > 0 ? window.scrollY / maxScroll : 0;
      document.getElementById('scroll-progress').style.width = `${targetScroll * 100}%`;
      const hint = document.getElementById('scroll-hint');
      if (hint) hint.style.opacity = targetScroll > 0.03 ? '0' : '1';
    });

    // --- Leather Patina Customizer ---
    document.querySelectorAll('.swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.swatch').forEach(b => b.classList.remove('ring-2', 'ring-[#f97316]', 'scale-110'));
        btn.classList.add('ring-2', 'ring-[#f97316]', 'scale-110');
        const c = new THREE.Color(btn.getAttribute('data-color'));
        const e = new THREE.Color(btn.getAttribute('data-edge'));
        outerHideMat.color.copy(c);
        pocketHideMat.color.copy(c).multiplyScalar(1.2);
        innerSuedeMat.color.copy(c).multiplyScalar(0.55);
        burnishedEdgeMat.color.copy(e);
      });
    });

    // --- Drag-to-Tilt (mouse only, touch keeps native scroll) ---
    let tiltTX = 0, tiltTY = 0, tiltX = 0, tiltY = 0;
    let dragging = false, px = 0, py = 0;
    container.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      dragging = true; px = e.clientX; py = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!dragging) return;
      tiltTY = clamp(tiltTY + (e.clientX - px) * 0.005, -0.9, 0.9);
      tiltTX = clamp(tiltTX + (e.clientY - py) * 0.005, -0.5, 0.5);
      px = e.clientX; py = e.clientY;
    });
    window.addEventListener('pointerup', () => { dragging = false; });

    // --- Animation Loop (scroll choreography) ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      currentScroll = lerp(currentScroll, targetScroll, 0.07);

      const pSpin    = smoothstep(remap(currentScroll, 0.05, 0.36)); // 180° turn
      const pOpen    = smoothstep(remap(currentScroll, 0.36, 0.68)); // unfold (+continue turn so interior faces camera)
      const pExplode = smoothstep(remap(currentScroll, 0.68, 0.96)); // exploded view
      const pPeek    = smoothstep(remap(currentScroll, 0.28, 0.42)); // cards peek after turn

      tiltX = lerp(tiltX, tiltTX, 0.08);
      tiltY = lerp(tiltY, tiltTY, 0.08);

      // Rotation: 180° turn, then continue another 180° while unfolding (interior faces camera)
      walletMaster.rotation.y = pSpin * Math.PI + pOpen * Math.PI + (pExplode * 0.28) + tiltY;
      walletMaster.rotation.x = lerp(0.08, 0.38, pExplode) + Math.sin(time * 1.5) * 0.02 + tiltX;

      // Unfold the left wing (PI = closed, 0 = open flat)
      leftHinge.rotation.y = lerp(Math.PI, 0, pOpen);
      leftHinge.position.z = lerp(0.26, 0.05, pOpen);

      // Keep centered (no text cards to dodge anymore)
      walletMaster.position.x = lerp(-W / 2 * 0.55, 0, pOpen);
      walletMaster.position.y = Math.sin(time * 1.4) * 0.05 - (pExplode * 0.25);

      // Cash divider drifts back in exploded view
      cashDividerWall.position.z = lerp(-0.22, -0.45, pExplode);

      // Banknotes expand + eject upward
      cashNotesGroup.scale.x = lerp(0.01, 1, pOpen);
      cashNotesGroup.position.y = lerp(0, 0.85, pExplode);
      cashNotesGroup.position.z = lerp(-0.18, -0.1, pExplode);

      // Cards: peek after turn, fan out in exploded view
      rightCards.forEach((card, i) => {
        card.position.y = card.userData.baseY + pPeek * 0.16 + pExplode * (0.42 + i * 0.32);
        card.position.z = card.userData.baseZ + pExplode * (0.18 + (2 - i) * 0.14);
        card.rotation.z = -pExplode * (0.04 * (i + 1));
      });
      leftCards.forEach((card, i) => {
        card.position.y = card.userData.baseY + pPeek * 0.16 + pExplode * (0.42 + i * 0.32);
        card.position.z = card.userData.baseZ + pExplode * (0.18 + (2 - i) * 0.14);
        card.rotation.z = pExplode * (0.04 * (i + 1));
      });

      // Pockets separate in Z
      rightPockets.forEach(p => { p.mesh.position.z = p.baseZ + pExplode * ((2 - p.index) * 0.09); });
      leftPockets.forEach(p => { p.mesh.position.z = p.baseZ + pExplode * ((2 - p.index) * 0.09); });

      // Camera pulls back as wallet opens
      camera.position.z = lerp(7.8, 8.8, pOpen) + (pExplode * 0.4);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
